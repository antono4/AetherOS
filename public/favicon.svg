<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradient Utama -->
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#8b5cf6;#ff00ff;#00f5ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ff00ff;#00f5ff;#8b5cf6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ff00ff">
        <animate attributeName="stop-color" values="#ff00ff;#00f5ff;#8b5cf6;#ff00ff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Gradient untuk Core -->
    <radialGradient id="gradCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#00f5ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Strong Glow -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner Shadow -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.5" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>
  
  <!-- Outer Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#gradMain)" stroke-width="2" opacity="0.3" filter="url(#glow)">
    <animate attributeName="r" values="26;25;26" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Middle Ring - Rotating Dashes -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#gradMain)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner Ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#gradMain)" stroke-width="1" opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection Lines -->
  <g opacity="0.4" stroke="url(#gradMain)" stroke-width="0.5">
    <line x1="32" y1="8" x2="32" y2="18"/>
    <line x1="32" y1="46" x2="32" y2="56"/>
    <line x1="8" y1="32" x2="18" y2="32"/>
    <line x1="46" y1="32" x2="56" y2="32"/>
    <line x1="15" y1="15" x2="22" y2="22"/>
    <line x1="42" y1="42" x2="49" y2="49"/>
    <line x1="49" y1="15" x2="42" y2="22"/>
    <line x1="22" y1="42" x2="15" y2="49"/>
  </g>
  
  <!-- Orbital Nodes -->
  <g filter="url(#strongGlow)">
    <!-- Top Node -->
    <circle cx="32" cy="8" r="2.5" fill="#00f5ff">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Right Node -->
    <circle cx="56" cy="32" r="2" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Bottom Node -->
    <circle cx="32" cy="56" r="2.5" fill="#ff00ff">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Left Node -->
    <circle cx="8" cy="32" r="2" fill="#00f5ff">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Diagonal Nodes -->
  <g filter="url(#glow)">
    <circle cx="15" cy="15" r="1.5" fill="#8b5cf6" opacity="0.7"/>
    <circle cx="49" cy="15" r="1.5" fill="#ff00ff" opacity="0.7"/>
    <circle cx="15" cy="49" r="1.5" fill="#ff00ff" opacity="0.7"/>
    <circle cx="49" cy="49" r="1.5" fill="#8b5cf6" opacity="0.7"/>
  </g>
  
  <!-- Core Glow -->
  <circle cx="32" cy="32" r="10" fill="url(#gradCore)">
    <animate attributeName="r" values="10;11;10" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Center Core -->
  <circle cx="32" cy="32" r="5" fill="#0a0a0f" stroke="url(#gradMain)" stroke-width="2" filter="url(#strongGlow)">
    <animate attributeName="r" values="5;4.5;5" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner Core -->
  <circle cx="32" cy="32" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.7;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>
